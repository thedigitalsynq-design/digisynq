name: Docker AD DC CI

on:
  push:
    branches: [ "main", "master", "domain-controller" ]
  pull_request:
    branches: [ "main", "master", "domain-controller" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose syntax
        run: |
          docker compose config

      - name: Build Docker Image
        run: |
          docker build -t samba-ad-dc:test ./docker

      - name: Test Container Initialization
        run: |
          docker run -d --name test-dc \
            -e REALM=TEST.LOCAL \
            -e DOMAIN=TEST \
            -e ADMIN_PASSWORD=P@ssw0rdTest123! \
            -e DNS_FORWARDER=8.8.8.8 \
            samba-ad-dc:test

          echo "Waiting for domain controller provisioning..."
          sleep 15
          docker logs test-dc

          echo "Verifying Samba tool domain info..."
          docker exec test-dc samba-tool domain info 127.0.0.1
          docker exec test-dc samba-tool fsmo show
