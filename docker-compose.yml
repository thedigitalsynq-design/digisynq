services:
  samba-dc:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: samba-ad-dc:latest
    container_name: samba-dc
    hostname: dc1
    domainname: ${REALM:-digisynq.com}
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      - REALM=${REALM:-DIGISYNQ.COM}
      - DOMAIN=${DOMAIN:-DIGISYNQ}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-P@ssw0rd2026!}
      - DNS_FORWARDER=${DNS_FORWARDER:-8.8.8.8}
      - SAMBA_LOG_LEVEL=${SAMBA_LOG_LEVEL:-1}
      - DISABLE_ADMIN_PASSWORD_EXPIRATION=${DISABLE_ADMIN_PASSWORD_EXPIRATION:-true}
      - DISABLE_PASSWORD_COMPLEXITY=${DISABLE_PASSWORD_COMPLEXITY:-false}
    ports:
      # DNS (Active Directory integrated DNS)
      - "53:53/tcp"
      - "53:53/udp"
      # Kerberos Authentication
      - "88:88/tcp"
      - "88:88/udp"
      # RPC Endpoint Mapper
      - "135:135/tcp"
      # NetBIOS Name Service & Datagram
      - "137:137/udp"
      - "138:138/udp"
      # NetBIOS Session Service
      - "139:139/tcp"
      # LDAP Directory Service
      - "389:389/tcp"
      - "389:389/udp"
      # SMB (File Sharing & Group Policy distribution)
      - "445:445/tcp"
      # Kerberos Password Change
      - "464:464/tcp"
      - "464:464/udp"
      # LDAPS (LDAP over SSL)
      - "636:636/tcp"
      # Global Catalog (LDAP & SSL)
      - "3268:3268/tcp"
      - "3269:3269/tcp"
    volumes:
      - samba_data:/var/lib/samba
      - samba_etc:/etc/samba
      - samba_log:/var/log/samba

volumes:
  samba_data:
    driver: local
  samba_etc:
    driver: local
  samba_log:
    driver: local
